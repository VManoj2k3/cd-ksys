# ============================================================
# Cd koosys — Code Review System Configuration
# ALL tunables live here. Code must not hardcode any of these.
# ============================================================

server:
  # For internal deployment bind to the internal interface, not 0.0.0.0,
  # unless a reverse proxy / firewall fronts it.
  host: "0.0.0.0"
  port: 8000
  max_file_size_kb: 512
  # early reject for oversized request bodies (JSON escaping inflates files;
  # keep comfortably above max_file_size_kb)
  max_request_kb: 2048
  job_ttl_seconds: 3600
  diff_display_max_lines: 12
  # ---- capacity limits (production) ----
  # reviews running at once; submissions beyond this queue (state stays
  # "queued"). Match roughly to llm.max_parallel_requests / GPU throughput.
  max_concurrent_reviews: 2
  # queued+running jobs beyond this are rejected with 429 (protects the queue)
  max_active_jobs: 10
  # total jobs kept in memory; oldest finished jobs are evicted beyond this
  max_jobs_in_memory: 500
  # per-user submission rate cap (429 beyond it)
  reviews_per_user_per_minute: 12
  # expired-job sweep interval
  gc_interval_seconds: 60
  # true when behind a reverse proxy that sets X-Forwarded-For (audit log
  # then records real client IPs instead of the proxy's)
  trust_proxy_headers: false
  # send Strict-Transport-Security (only when serving HTTPS directly;
  # usually the reverse proxy owns this header)
  hsts_enabled: false
  # bearer token for GET /api/metrics (prefer env KOOSYS_METRICS_TOKEN).
  # empty + auth.mode=none -> metrics open; empty + auth on -> session required
  metrics_token: ""

logging:
  level: "info"          # debug | info | warning | error | critical
  format: "plain"        # "plain" for terminals, "json" for log shippers
  access_log: true

# ---------------- Authentication (internal deployment) ----------------
auth:
  # "ldap" (company LDAP/AD) | "token" (shared secret) | "none" (dev only)
  mode: "none"
  session_ttl_seconds: 28800          # 8 hours
  # login throttling: after this many FAILED attempts per (ip, username)
  # within the window, sign-in returns 429 until the window rolls over
  login_max_attempts: 5
  login_window_seconds: 300
  # broader per-IP failure cap (slows credential spraying across usernames)
  login_ip_max_attempts: 20
  # REQUIRED for ldap/token: a long random secret to sign session cookies.
  # Set via env KOOSYS_SESSION_SECRET instead of committing it here.
  session_secret: ""
  cookie_secure: false                # true when served over HTTPS
  shared_token: ""                    # used when mode=token (prefer env KOOSYS_SHARED_TOKEN)
  ldap:
    server_uri: "ldaps://ldap.company.internal:636"
    use_tls: true
    tls_verify: true
    timeout_seconds: 8
    # Option A — direct bind (Active Directory): {username} is substituted.
    #   bind_dn_template: "{username}@company.internal"
    # Option B — search-then-bind (OpenLDAP): leave template empty and set these.
    bind_dn_template: ""
    base_dn: "dc=company,dc=internal"
    user_attribute: "sAMAccountName"  # or "uid" for OpenLDAP
    search_bind_dn: ""                # service account DN (read-only)
    search_bind_password: ""          # prefer env; leave empty to bind anonymously

audit:
  enabled: true
  log_path: ""                        # empty = <project>/logs/audit.log

# External analysis tools (cppcheck/clang-tidy/flawfinder/ruff/bandit/pmd/eslint):
# hard wall-clock cap per invocation so a pathological file can never hang a
# review worker. On timeout that layer yields nothing and the review continues.
tools:
  timeout_seconds: 90

# Overall per-review cap. Exceeding it marks the job "error" (timed out) and
# frees the worker — protects a multi-user service from a stuck review.
# Large files (thousands of lines) legitimately need time on slower GPUs.
review_max_seconds: 1800   # 30 minutes

languages:
  enabled: ["python", "c", "cpp", "java", "typescript"]

# ---------------- C / C++ (primary languages; AUTOSAR-guided) ----------------
c:
  std: "c11"
  cppcheck: { enabled: true, enable: "warning,portability" }
  clang_tidy:
    enabled: true
    checks: ["bugprone-*", "cert-*", "-cert-err34-c",
             "-bugprone-easily-swappable-parameters"]
  flawfinder: { enabled: true, min_level: 2 }
  ruleset: "autosar"    # injects AUTOSAR rule subset into LLM review
  ruleset_file: "autosar_c.txt"   # C-specific rules (no C++ constructs)
  # Deterministic magic-number scan (replaces the LLM's unreliable version).
  # Flags RAW numeric literals in executable code; skips #define bodies,
  # comments, strings, named constants, and the allow-list below.
  magic_numbers:
    enabled: true
    allowed: [0, 1, 2, -1]
  # cppcheck/clang-tidy re-report ONE defect (message carries the identifier)
  # at every use-site — collapse those repeats to the earliest line.
  collapse_repeated_lint: true
  llm_categories: ["memory_safety", "undefined_behavior", "resource_leak",
                   "concurrency", "security", "api_misuse", "error_handling",
                   "logic_bug", "autosar"]

cpp:
  std: "c++14"          # AUTOSAR C++14 target
  cppcheck: { enabled: true, enable: "warning,portability" }
  clang_tidy:
    enabled: true
    checks: ["bugprone-*", "cert-*", "cppcoreguidelines-*",
             "-cppcoreguidelines-avoid-magic-numbers",
             "-cppcoreguidelines-pro-type-vararg",
             "-cppcoreguidelines-pro-bounds-array-to-pointer-decay",
             "-cppcoreguidelines-init-variables",
             "-cppcoreguidelines-avoid-non-const-global-variables",
             "-bugprone-easily-swappable-parameters"]
  flawfinder: { enabled: true, min_level: 2 }
  ruleset: "autosar"
  ruleset_file: "autosar_cpp.txt"   # C++14-specific rules
  magic_numbers:
    enabled: true
    allowed: [0, 1, 2, -1]
  collapse_repeated_lint: true
  llm_categories: ["memory_safety", "undefined_behavior", "resource_leak",
                   "concurrency", "security", "api_misuse", "error_handling",
                   "logic_bug", "autosar"]

# ---------------- Java ----------------
java:
  pmd:
    enabled: true
    path: ""            # auto-discovered; Kaggle bootstrap downloads it
    version: "7.7.0"
    ruleset: "rulesets/java/quickstart.xml"
  llm_categories: ["logic_bug", "security", "api_misuse", "resource_leak",
                   "concurrency", "error_handling"]

# ---------------- TypeScript / JavaScript ----------------
typescript:
  llm_categories: ["logic_bug", "security", "api_misuse", "resource_leak",
                   "concurrency", "error_handling"]

# ---------------- L0: Spell layer ----------------
spell:
  enabled: true
  min_word_length: 4
  autofix_single_suggestion_only: true
  check_identifiers: true
  check_comments: true
  check_strings: true
  # DYNAMIC false-positive suppression — no hardcoded word lists.
  # The checker learns each codebase's own naming conventions: a subword used
  # across >= vocab_min_identifiers DISTINCT identifiers is treated as project
  # vocabulary (e.g. 'Shft' in ShftSpdSig/ShftSpdCtrl/...), while a rare
  # dictionary misspelling (a genuine typo like 'Treshold') stays reportable.
  dynamic_vocabulary: true
  vocab_min_identifiers: 3
  # optional manual overrides (empty by default — the code teaches the rules)
  allowlist: []
  # identifiers with these prefixes are generated/external API (AUTOSAR BSW):
  # report typos but never offer a file-local rename (would break the build)
  external_prefixes:
    ["Rte_", "Os_", "Dem_", "Det_", "Com_", "NvM_", "EcuM_", "BswM_",
     "Can", "Lin", "Fr_", "Eth_", "Dcm_", "PduR_", "Std_", "VStdLib_",
     "Mcu_", "Port_", "Dio_", "Adc_", "Pwm_", "Gpt_", "Spi_", "Wdg_"]

# ---------------- L1: Deterministic lint ----------------
lint:
  ruff:
    enabled: true
    # rule families: E/W pycodestyle, F pyflakes, B bugbear, N naming, PLE pylint-errors
    select: ["E4", "E7", "E9", "F", "B", "N", "PLE"]
    ignore: []
  bandit:
    enabled: true
    # bandit confidence/severity floor to report (LOW|MEDIUM|HIGH)
    min_severity: "LOW"
    min_confidence: "MEDIUM"

# ---------------- L1b: Hardcoding scanner (disabled per user decision;
# flip to true to flag magic numbers / secrets / URLs in submitted code) ----
hardcode:
  enabled: false
  magic_numbers:
    enabled: true
    allowed: [0, 1, -1, 2]
    # don't flag numbers assigned to UPPER_CASE module constants
    skip_constant_assignments: true
    skip_default_args: true
  strings:
    flag_urls: true
    flag_absolute_paths: true
    flag_ip_addresses: true
  secrets:
    enabled: true

# ---------------- L2/L3: LLM layers ----------------
llm:
  base_url: "http://127.0.0.1:8080/v1"
  api_key: "none"
  model: "qwen2.5-coder-14b-instruct"
  mock: false            # true = skip LLM layers (deterministic only)
  temperature: 0.0
  max_tokens_review: 2048
  max_tokens_verify: 512
  max_tokens_fix: 1024
  timeout_seconds: 300
  max_parallel_requests: 2
  # cache llama-server health probes this long (UI polling must not hammer it)
  health_cache_seconds: 5
  chunk_lines: 220        # split large files into chunks of this many lines
  # overlap between adjacent chunks so a boundary defect is seen in context by
  # at least one chunk. 0 = disjoint (previous behavior). Duplicates from
  # overlapping chunks are collapsed after anchoring. Try 30 on the GPU stack
  # and compare accuracy_eval results before/after.
  chunk_overlap_lines: 0
  # line-anchor validation: how far from claimed line to search for quoted snippet
  anchor_search_radius: 2
  verify:
    enabled: true         # adversarial verification pass on every LLM finding
  fix:
    max_retries: 2        # regenerate a failed fix this many times
    # adversarial re-check of every LLM-generated semantic fix: a skeptic
    # judges whether the patch resolves the reported problem minimally.
    # One extra (cheap) LLM call per fix; rejected fixes are retried.
    verify_enabled: true

review:
  # categories the LLM is allowed to report (anything else is rejected)
  llm_categories: ["logic_bug", "security", "api_misuse", "resource_leak", "concurrency", "error_handling"]
  context_lines_for_verify: 12
  context_lines_for_fix: 15
  # drop LLM "ignored return value" findings on (void)-cast lines (AUTOSAR idiom)
  suppress_void_cast_ignored_return: true
  # the LLM flags NAMED constants (TRUE, ERROR_PRESENT) as "magic literals" —
  # unreliable. A deterministic scanner owns numeric literals; drop LLM's ones.
  suppress_llm_magic_literal: true
  # C is not C++: drop LLM findings that push C++-only constructs on a C file
  suppress_cpp_advice_on_c: true
  cpp_only_markers:
    ["static_cast", "reinterpret_cast", "const_cast", "dynamic_cast",
     "smart pointer", "unique_ptr", "shared_ptr", "std::", "raii",
     "rule of five", "rule of three", "new/delete", "delete[]",
     "template", "namespace", "constexpr", "nullptr instead"]
  # 0 = unlimited (report every finding, generate every fix — no caps)
  max_llm_findings: 0       # keep highest-severity N before verify (0 = all)
  max_fixes: 0              # cap LLM fix-generation calls (0 = all)
  fix_budget_seconds: 1740  # fix stage budget (just under the 30-min review cap)
  # fix validation: a candidate patch is rejected unless the violation is gone
  # AND no NEW deterministic finding appeared anywhere in the patched file
  fix_detector_gate: true       # run lint+security before/after LLM fixes too
  fix_recheck_line_window: 3    # line tolerance when matching findings pre/post patch

paths:
  prompts_dir: "prompts"
  frontend_dir: "frontend"
  tools_dir: ""          # empty = <project>/.tools (eslint toolchain etc.)

# ---------------- Kaggle deployment ----------------
kaggle:
  model_repo: "bartowski/Qwen2.5-Coder-14B-Instruct-GGUF"
  model_file: "Qwen2.5-Coder-14B-Instruct-Q6_K.gguf"
  model_dir: "/kaggle/working/models"
  llama_server:
    host: "127.0.0.1"
    port: 8080
    ctx_size: 16384
    n_gpu_layers: 999
    split_mode: "layer"
    tensor_split: "1,1"
    parallel_slots: 2
    flash_attn: false      # T4 (compute 7.5) — leave off unless build supports it
  llama_cpp_release: "latest"  # llama.cpp release tag, or "latest"
  nvcc_search_paths:
    - "/usr/local/cuda*/bin/nvcc"
    - "/opt/cuda*/bin/nvcc"
    - "/opt/conda/bin/nvcc"
    - "/opt/conda/pkgs/cuda-nvcc*/bin/nvcc"
  llama_cpp_pip_indexes:
    - "https://abetlen.github.io/llama-cpp-python/whl/cu125"
    - "https://abetlen.github.io/llama-cpp-python/whl/cu124"
    - "https://abetlen.github.io/llama-cpp-python/whl/cu122"
    - "https://abetlen.github.io/llama-cpp-python/whl/cu121"
  tunnel:
    provider: "cloudflared"    # cloudflared quick tunnel needs no account
    local_port: 8000
