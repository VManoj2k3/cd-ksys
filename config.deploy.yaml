# Production overlay for on-prem Docker deployment.
#
# This file is DEEP-MERGED over config.yaml (env KOOSYS_CONFIG_OVERLAY points
# here — see deploy/docker-compose.yml). Only put the keys you CHANGE for
# production in this file; everything else inherits from config.yaml, so new
# tunables added there can never silently drift out of the deployment.
#
# Secrets (session secret, LDAP service password, metrics token) come from
# the environment / deploy/.env — never from this file.

server:
  host: 0.0.0.0            # container-internal; compose maps 127.0.0.1:8000
  trust_proxy_headers: true # behind the internal reverse proxy
  max_concurrent_reviews: 2 # match GPU throughput (llama parallel slots)
  max_active_jobs: 10

logging:
  level: info
  format: json             # one JSON object per line for log shippers

auth:
  mode: ldap
  cookie_secure: true      # served over HTTPS via the reverse proxy
  ldap:
    server_uri: ldaps://ldap.company.internal:636
    use_tls: true
    tls_verify: true
    timeout_seconds: 8
    # Active Directory: set bind_dn_template ("{username}@company.internal")
    # OpenLDAP: leave template empty, set base_dn + user_attribute + service bind
    bind_dn_template: ''
    base_dn: dc=company,dc=internal
    user_attribute: sAMAccountName
    search_bind_dn: ''
    search_bind_password: ''   # prefer env; leave empty to bind anonymously
